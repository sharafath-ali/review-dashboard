services:
  postgres:
    image: postgres:16-alpine
    container_name: reviewdash-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: reviewdash
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reviewdash-app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/reviewdash
      # Note: inside Docker, app connects to 'postgres' container directly on 5432
      SCRAPINGDOG_API_KEY: ${SCRAPINGDOG_API_KEY}
      AMAZON_DOMAIN: ${AMAZON_DOMAIN:-in}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx tsx node_modules/knex/bin/cli.js migrate:latest && node .next/standalone/server.js"
    restart: unless-stopped

volumes:
  postgres_data:
